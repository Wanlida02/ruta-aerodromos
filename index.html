<title>Ruta de Aeródromos</title>
<meta name="description" content="Reparte aeródromos entre los días de tu estancia, optimiza la conducción y abre la ruta en Google Maps, Waze o Mapas de iPhone.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">

/* Layout: cabecera + ajustes + tablero de días en columnas (una por día + "Sin asignar") + mapa pequeño + enlaces de navegación */
:root{
  color-scheme:light;
  --bg:#EDF0F4; --surface:#FFFFFF; --surface2:#F5F7FA; --ink:#12202E; --muted:#566879; --line:#D3DAE2;
  --accent:#0A5FB4; --accent-ink:#FFFFFF; --accent-soft:#E2EDF9;
  --ok:#1B7A4B; --ok-soft:#E1F3EA; --warn:#9A5B00; --warn-soft:#FFF1D6; --bad:#B3261E; --bad-soft:#FBE6E3;
  --d0:#0A5FB4; --d1:#C2410C; --d2:#0F766E; --d3:#7C3AED; --d4:#A16207; --d5:#BE185D; --d6:#4D7C0F;
  --shadow:0 1px 2px rgba(18,32,46,.06),0 4px 14px rgba(18,32,46,.06);
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1620; --surface:#15212D; --surface2:#1B2A39; --ink:#E6EDF4; --muted:#94A5B6; --line:#2A3B4C;
  --accent:#5DA8F2; --accent-ink:#0B1824; --accent-soft:#1A3550;
  --ok:#52C58B; --ok-soft:#173A2B; --warn:#F0B54F; --warn-soft:#3B2D10; --bad:#FF8A80; --bad-soft:#3F1B18;
  --d0:#5DA8F2; --d1:#FB923C; --d2:#2DD4BF; --d3:#A78BFA; --d4:#FACC15; --d5:#F472B6; --d6:#A3E635;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1620; --surface:#15212D; --surface2:#1B2A39; --ink:#E6EDF4; --muted:#94A5B6; --line:#2A3B4C;
  --accent:#5DA8F2; --accent-ink:#0B1824; --accent-soft:#1A3550;
  --ok:#52C58B; --ok-soft:#173A2B; --warn:#F0B54F; --warn-soft:#3B2D10; --bad:#FF8A80; --bad-soft:#3F1B18;
  --d0:#5DA8F2; --d1:#FB923C; --d2:#2DD4BF; --d3:#A78BFA; --d4:#FACC15; --d5:#F472B6; --d6:#A3E635;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.45 var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--f-display);margin:0;font-weight:600;text-wrap:balance}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px}
.top h1{font-size:30px;letter-spacing:.01em;line-height:1.05}
.top p{margin:4px 0 0;color:var(--muted);max-width:60ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:12px;color:var(--muted)}
.chip b{color:var(--ink);font-weight:600}
.chip.ok{background:var(--ok-soft);color:var(--ok);border-color:transparent}
.chip.ok b{color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.warn b{color:var(--warn)}
.chip button{all:unset;cursor:pointer;text-decoration:underline}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.setup{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px 18px;padding:14px 16px}
.field{display:flex;flex-direction:column;gap:4px;min-width:0;position:relative}
.field label,.lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.field input,.field select{border:1px solid var(--line);background:var(--surface2);border-radius:6px;padding:7px 9px;min-width:0;width:100%}
.field small{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.inrow{display:flex;gap:6px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper button{width:34px;height:34px;border-radius:6px;border:1px solid var(--line);background:var(--surface2);font-size:18px;line-height:1}
.stepper output{min-width:2ch;text-align:center;font:600 18px var(--f-mono)}
details.adv{grid-column:1/-1;border-top:1px solid var(--line);padding-top:10px}
details.adv summary{cursor:pointer;font-weight:600;color:var(--accent)}
.advgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-top:10px}
.check{display:flex;align-items:center;gap:8px;font-size:13px}
.check input{width:auto}
.addbar{display:flex;flex-wrap:wrap;gap:10px;padding:12px 16px;align-items:flex-end}
.addbar .field{flex:1 1 280px}
.addbar .field.sm{flex:0 0 120px}
.btn{border:1px solid var(--line);background:var(--surface2);border-radius:6px;padding:8px 14px;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.small{padding:5px 10px;font-size:12px}
.msg{padding:0 16px 12px;color:var(--bad);font-size:13px}
.msg.info{color:var(--muted)}
.sugg{position:absolute;left:0;right:0;top:100%;z-index:20;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);margin-top:4px;max-height:340px;overflow:auto}
.sugg .hd{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:8px 12px 4px}
.sugg button{all:unset;box-sizing:border-box;display:block;width:100%;padding:8px 12px;cursor:pointer}
.sugg button:hover,.sugg button:focus-visible{background:var(--accent-soft)}
.sugg .t{font-weight:600}
.sugg .s{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.sugg .none{padding:10px 12px;color:var(--muted);font-size:13px}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.summary div{background:var(--surface);padding:10px 14px}
.summary .v{font:600 22px/1.1 var(--f-display);font-variant-numeric:tabular-nums}
.summary .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.toolbar{display:flex;flex-wrap:wrap;gap:8px}
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(272px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px;scroll-snap-type:x proximity;align-items:start}
@media (max-width:640px){.board{grid-auto-columns:86%}}
.col{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);scroll-snap-align:start;min-width:0;display:flex;flex-direction:column}
.col.over{outline:2px dashed var(--accent);outline-offset:-2px;background:var(--accent-soft)}
.col.un{background:var(--surface2);border-style:dashed;box-shadow:none}
.colhead{padding:12px 14px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px;border-top:4px solid var(--dc,var(--line));border-radius:10px 10px 0 0}
.colhead .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.colhead h3{font-size:22px;line-height:1}
.colhead .date{color:var(--muted);font-size:12px;text-transform:capitalize}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}
.stat .k{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.stat .v{font:500 14px var(--f-mono);font-variant-numeric:tabular-nums}
.badge{display:inline-block;border-radius:4px;padding:1px 7px;font-size:11px;font-weight:600}
.badge.ok{background:var(--ok-soft);color:var(--ok)}
.badge.bad{background:var(--bad-soft);color:var(--bad)}
.badge.idle{background:var(--surface2);color:var(--muted)}
.why{font-size:12px;color:var(--bad)}
details.hours summary{cursor:pointer;font-size:12px;color:var(--accent);font-weight:600}
.hoursgrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:8px}
.hoursgrid .field input{padding:5px 6px}
.list{padding:10px 10px 12px;display:flex;flex-direction:column;gap:6px;min-height:84px}
.mark{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);padding:2px 6px}
.mark .mono{color:var(--ink);font-weight:600}
.mark.lunch{background:var(--warn-soft);color:var(--warn);border-radius:6px;padding:5px 8px}
.leg{display:flex;flex-wrap:wrap;align-items:center;gap:2px 8px;font-size:12px;color:var(--muted);padding:2px 6px 2px 18px;border-left:2px dotted var(--line);margin-left:14px;min-height:24px}
.leg .mono{color:var(--ink)}
.leg input{width:62px;border:1px solid var(--line);background:var(--surface2);border-radius:5px;padding:2px 5px}
.leg .est{color:var(--warn)}
.stop{display:grid;grid-template-columns:auto auto 1fr;gap:4px 8px;align-items:start;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 8px 8px 4px}
.stop.off{opacity:.55;background:var(--surface2)}
.stop.off .nm{text-decoration:line-through}
.stop.dragging{opacity:.3}
.grip{touch-action:none;cursor:grab;width:26px;height:34px;display:flex;align-items:center;justify-content:center;color:var(--muted);border-radius:4px}
.grip:hover{background:var(--surface2)}
.grip svg{width:14px;height:14px;fill:currentColor}
.stop input[type=checkbox]{width:20px;height:20px;margin:7px 0 0;accent-color:var(--accent)}
.stop .body{min-width:0;display:flex;flex-direction:column;gap:3px}
.stop .nm{font-weight:600;overflow-wrap:anywhere}
.icao{font:600 11px var(--f-mono);background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:1px 6px;margin-right:6px;vertical-align:1px}
.stop .times{font:500 12px var(--f-mono);color:var(--muted)}
.stop .ctl{grid-column:2/-1;display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;font-size:12px;color:var(--muted)}
.stop .ctl input[type=number]{width:62px;border:1px solid var(--line);background:var(--surface2);border-radius:5px;padding:2px 5px}
.stop .ctl input[type=text]{flex:1 1 160px;min-width:0;border:1px solid var(--line);background:var(--surface2);border-radius:5px;padding:3px 6px}
.stop .ctl select{border:1px solid var(--line);background:var(--surface2);border-radius:5px;padding:2px 4px;max-width:120px}
.stop .note{grid-column:2/-1;font-size:12px;color:var(--warn)}
.linkbtn{all:unset;cursor:pointer;color:var(--accent);font-size:12px;text-decoration:underline}
.linkbtn:focus-visible{outline:2px solid var(--accent)}
.pin{font-weight:600}
.empty{color:var(--muted);font-size:13px;padding:10px 6px;text-align:center;border:1px dashed var(--line);border-radius:8px}
.ghost{position:fixed;z-index:50;pointer-events:none;opacity:.92;box-shadow:0 10px 30px rgba(0,0,0,.28);transform:rotate(1.5deg)}
.below{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
.mapcard{padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.mapcard h2,.links h2{font-size:20px}
.mapslot{position:relative;max-width:560px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface2)}
.leafmap{width:100%;height:320px;background:var(--surface2)}
.leafmap.big{height:72vh;min-height:320px}
.mapzoom{all:unset;position:absolute;inset:0;z-index:500;cursor:zoom-in}
.mapzoom span{position:absolute;right:8px;top:8px;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:12px;font-weight:600}
.mapnote{padding:28px 14px;text-align:center;color:var(--muted)}
.mk{display:flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;border:2px solid #fff;color:#fff;font:700 12px var(--f-mono);box-shadow:0 1px 4px rgba(0,0,0,.45)}
.mk.h{border-radius:5px;background:#12202E}
.mk.off{background:#fff;color:#566879;border:2px dashed #566879}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:14px;height:4px;border-radius:2px;margin-right:6px;vertical-align:middle}
.modal{position:fixed;inset:0;z-index:2000;background:rgba(8,14,20,.72);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal .inner{background:var(--surface);border-radius:10px;max-width:1100px;width:100%;max-height:100%;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:8px}
.modal .inner svg{width:100%;height:auto}
.links{padding:14px;display:flex;flex-direction:column;gap:12px}
.linkday{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:10px}
.linkday:first-of-type{border-top:0;padding-top:0}
.linkday .hd{display:flex;align-items:center;gap:8px;font-weight:600}
.linkday .hd i{width:12px;height:12px;border-radius:3px;background:var(--dc)}
.navs{display:flex;flex-wrap:wrap;gap:8px}
.nav{display:inline-flex;align-items:center;gap:6px;text-decoration:none;border-radius:6px;padding:9px 14px;font-weight:600;border:1px solid var(--line);background:var(--surface2);color:var(--ink)}
.nav.g{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.nav.a{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.nav.mini{padding:4px 9px;font-size:12px}
.wazes{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.foot{font-size:12px;color:var(--muted);max-width:90ch}
.toast{position:fixed;left:50%;bottom:max(16px,env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;z-index:3000;font-size:13px;max-width:90vw}
@media (min-width:980px){.below{grid-template-columns:minmax(0,560px) minmax(0,1fr);align-items:start}}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>

<script>

var routeCache=lsGet(KEY_ROUTES)||{},geoCache=lsGet(KEY_GEO)||{},geoFail={},memo=new Map();

}

function ck(n){return n.lat.toFixed(4)+","+n.lon.toFixed(4);}
function okey(a,b){return a<b?a+"|"+b:b+"|"+a;}

/* ---------- Distancias y tiempos ---------- */
function timeFromKm(k){return Math.max(1,Math.ceil((+state.cfg.over||0)+k/(+state.cfg.speed||82)*60));}
function leg(a,b){
  if(a===b)return {min:0,km:0,src:"osrm"};
  var o=state.ov[okey(a,b)];if(o)return {min:o.min,km:o.km,src:"ov"};
  var A=node(a),B=node(b),r=routeCache[ck(A)+">"+ck(B)]||routeCache[ck(B)+">"+ck(A)];
  if(r)return {min:timeFromKm(r),km:r,src:"osrm"};

function coverage(){
  var ids=(state.hotel.set===false?[]:["H"]).concat(state.places.filter(function(p){return p.on;}).map(function(p){return p.id;})),tot=0,real=0;

  var ns=nodeList(),need=false;

  return loadRoutes().then(function(changed){memo=new Map();if(changed&&reopt)optimizeAll();save();render();});
}

/* ---------- Simulación de un día ---------- */
function evalDay(d,ids){
  var key=d+":"+ids.join(",");if(memo.has(key))return memo.get(key);
  var day=state.days[d],c=state.cfg,live=ids.filter(function(id){var p=byId(id);return p&&p.on;});
  var t=toMin(day.start),prev="H",drive=0,km=0,visit=0,lunch=null,seq=[],ls=toMin(c.lunchStart),lm=+c.lunchMin||0;

  live.forEach(function(id){
    var L=leg(prev,id);seq.push({type:"leg",from:prev,to:id,min:L.min,km:L.km,src:L.src});
    t+=L.min;drive+=L.min;km+=L.km;lunchCheck();
    var p=byId(id);
    if(!lunch&&lm>0&&t<ls&&ls-t<=45&&t+(+p.visit||0)>ls+30){lunch={t0:t,t1:t+lm};seq.push({type:"lunch",t0:t,t1:t+lm});t+=lm;}
    var arr=t;t+=(+p.visit||0);visit+=(+p.visit||0);

  memo.set(key,r);return r;
}
function dayCost(e){return e.feasible?e.drive+e.km*0.05:100000+e.over*100+e.drive;}

/* ---------- Optimización ---------- */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;var t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function cleanPins(){state.places.forEach(function(p){if(p.pin!=null&&p.pin!==-1&&p.pin>=state.nDays)p.pin=null;});}
function normalizePlan(){
  while(state.plan.days.length<state.nDays)state.plan.days.push([]);
  while(state.plan.days.length>state.nDays)state.plan.un=state.plan.un.concat(state.plan.days.pop());
  var seen={};
  state.plan.days=state.plan.days.map(function(a){return a.filter(function(i){if(seen[i]||!byId(i))return false;seen[i]=1;return true;});});
  state.plan.un=state.plan.un.filter(function(i){if(seen[i]||!byId(i))return false;seen[i]=1;return true;});
  state.places.forEach(function(p){if(!seen[p.id])state.plan.un.push(p.id);});
  while(state.days.length<state.nDays)state.days.push({start:state.cfg.defStart,end:state.cfg.defEnd,max:+state.cfg.defMax});

  var offLoc={};state.plan.days.forEach(function(a,d){a.forEach(function(i){if(!byId(i).on)offLoc[i]=d;});});

  var penUn=3000;
  function total(pl){var c=0,ws=[];for(var d=0;d<D;d++){var e=evalDay(d,pl.days[d]);c+=dayCost(e);ws.push(e.work);}

    if(state.cfg.balance)ws.forEach(function(w){c+=(w/60)*(w/60)*4;});return c;}

  function clone(pl){return {days:pl.days.map(function(a){return a.slice();}),un:pl.un.slice()};}

   '<div class="stat"><div class="k">Horas de trabajo</div><div class="v">'+(e.work/60).toFixed(1).replace(".",",")+' / '+day.max+' h</div></div>'+
   '<div class="stat"><div class="k">Regreso</div><div class="v">'+(e.n?fmt(e.end):"—")+'</div></div></div>'+why+
   '<details class="hours"><summary>Horario y límite del día</summary><div class="hoursgrid">'+
   '<div class="field"><label for="s'+d+'">Inicio</label><input id="s'+d+'" type="time" value="'+day.start+'" data-field="dstart" data-d="'+d+'"></div>'+
   '<div class="field"><label for="e'+d+'">Fin</label><input id="e'+d+'" type="time" value="'+day.end+'" data-field="dend" data-d="'+d+'"></div>'+
   '<div class="field"><label for="m'+d+'">Máx. h</label><input id="m'+d+'" type="number" min="1" max="16" step="0.5" value="'+day.max+'" data-field="dmax" data-d="'+d+'"></div></div>'+
   '<div style="margin-top:8px"><button class="btn small" data-act="reorder" data-d="'+d+'">Reordenar este día</button></div></details></div>'+
   '<div class="list">'+body+'</div></section>';
}
function fitsAlone(id){
  for(var d=0;d<state.nDays;d++){if(evalDay(d,[id]).feasible)return true;}return false;}
function unHTML(){
  var ids=state.plan.un,body=ids.map(function(i){return stopHTML(i,-1,null);}).join("");
  return '<section class="col un" data-col="u"><div class="colhead"><div class="row"><h3>Sin asignar</h3><span class="badge idle">'+ids.length+'</span></div>'+
    '<div class="muted" style="font-size:12px">Lo que no cabe en los días o has apartado. No cuenta en la ruta.</div>'+(function(){var bad=ids.filter(function(i){return byId(i).on&&!fitsAlone(i);});
    return bad.length?'<div class="why">'+(state.hotel.set===false?'Falta indicar el hotel.':'No caben ni solos en un día (muy lejos del hotel, o con horario o límite muy corto): '+bad.map(function(i){return esc(byId(i).name);}).join(", ")+'. Revisa el hotel, el horario o el límite de horas.')+'</div>':'';})()+'</div><div class="list">'+(body||'<div class="empty">Todo está asignado</div>')+'</div></section>';
}
function render(){
  var open=[];document.querySelectorAll("details[open]").forEach(function(x,i){open.push(i);});
  var ae=document.activeElement,aid=ae&&ae.id,avl=ae&&ae.value,aval=(aid==="addtxt"||aid==="hotelq")?avl:null;
  var tot={drive:0,km:0,n:0};
  for(var d=0;d<state.nDays;d++){var e=evalDay(d,state.plan.days[d]);tot.drive+=e.drive;tot.km+=e.km;tot.n+=e.n;}
  var total=state.places.filter(function(p){return p.on;}).length,cov=coverage();
  var status=routeMode==="loading"?'<span class="chip">Consultando rutas…</span>':
    (cov.real===cov.tot&&cov.tot>0)?'<span class="chip ok"><b>Rutas reales</b> · km por carretera (OpenStreetMap)</span>':
    '<span class="chip warn"><b>'+(cov.real?"Parte estimada":"Distancias estimadas")+'</b> · '+(routeMode==="fail"?"sin conexión a rutas":"tramos con ≈")+' <button data-act="retry">Consultar rutas reales</button></span>';
  var h='<header class="top"><div><h1>Ruta de aeródromos</h1><p>Reparte los aeródromos entre los días de tu estancia y ordénalos para conducir lo mínimo, respetando horas, comida y horario.</p></div><div class="chips">'+status+(state.example?'<span class="chip">Ejemplo de demostración</span>':"")+'</div></header>';
  h+='<div class="card setup">'+
   '<div class="field"><label for="hotelq">Hotel</label><div class="inrow"><input id="hotelq" type="text" placeholder="Nombre y ciudad, o coordenadas" value="" autocomplete="off"><button class="btn" data-act="hsearch" type="button">Buscar</button></div>'+
   '<div class="sugg" id="hsugg" hidden></div>'+(state.hotel.set===false?'<small style="color:var(--warn)"><b>Falta el hotel.</b> Búscalo arriba (nombre y ciudad) para calcular las rutas.</small>':'<small><b>'+esc(state.hotel.name)+'</b> · <span class="mono">'+state.hotel.lat.toFixed(4)+', '+state.hotel.lon.toFixed(4)+'</span>'+(state.hotel.approx?' · '+esc(state.hotel.note||"posición aproximada"):"")+'</small>')+'</div>'+
   '<div class="field"><span class="lbl">Días de estancia</span><div class="stepper"><button data-act="daysminus" aria-label="Quitar un día">−</button><output>'+state.nDays+'</output><button data-act="daysplus" aria-label="Añadir un día">+</button></div></div>'+
   '<div class="field"><label for="fd">Primer día (opcional)</label><input id="fd" type="date" value="'+esc(state.firstDate)+'" data-field="firstDate"></div>'+
   '<details class="adv"><summary>Ajustes de comida y cálculo</summary><div class="advgrid">'+
   '<div class="field"><label for="ls">Comida desde</label><input id="ls" type="time" value="'+state.cfg.lunchStart+'" data-field="cfg.lunchStart"></div>'+
   '<div class="field"><label for="lm">Duración comida (min)</label><input id="lm" type="number" min="0" step="15" value="'+state.cfg.lunchMin+'" data-field="cfg.lunchMin"></div>'+
   '<div class="field"><label for="ov">Margen por tramo (min)</label><input id="ov" type="number" min="0" max="20" value="'+state.cfg.over+'" data-field="cfg.over"></div>'+
   '<div class="field"><label for="sp">Velocidad media (km/h)</label><input id="sp" type="number" min="30" max="120" value="'+state.cfg.speed+'" data-field="cfg.speed"></div>'+
   '<div class="field"><label for="fc">Factor recta→carretera</label><input id="fc" type="number" min="1" max="2" step="0.05" value="'+state.cfg.factor+'" data-field="cfg.factor"></div>'+
   '<div class="field"><label for="dv">Inspección por defecto (min)</label><input id="dv" type="number" min="15" step="15" value="'+state.cfg.defVisit+'" data-field="cfg.defVisit"></div>'+
   '<div class="field"><label for="ds">Inicio por defecto</label><input id="ds" type="time" value="'+state.cfg.defStart+'" data-field="cfg.defStart"></div>'+
   '<div class="field"><label for="de">Fin por defecto</label><input id="de" type="time" value="'+state.cfg.defEnd+'" data-field="cfg.defEnd"></div>'+
   '<div class="field"><label for="dm">Máx. horas por defecto</label><input id="dm" type="number" min="1" max="16" step="0.5" value="'+state.cfg.defMax+'" data-field="cfg.defMax"></div>'+
   '<div class="field"><span class="lbl">Aplicar a todos los días</span><button class="btn small" data-act="applydef">Aplicar horario</button></div>'+
   '<label class="check"><input type="checkbox" data-field="cfg.balance"'+(state.cfg.balance?" checked":"")+'> Equilibrar la carga entre días</label>'+
   '</div></details></div>';
  h+='<form class="card" id="addform" autocomplete="off"><div class="addbar"><div class="field"><label for="addtxt">Añadir aeródromo</label><input id="addtxt" type="text" placeholder="Nombre, código OACI (LEMP), municipio o coordenadas" autocomplete="off"><div class="sugg" id="sugg" hidden></div></div>'+
   '<div class="field sm"><label for="addmin">Inspección (min)</label><input id="addmin" type="number" min="15" step="15" value="'+state.cfg.defVisit+'"></div>'+
   '<button class="btn primary" type="submit">Añadir</button></div>'+(addMsg?'<div class="msg">'+esc(addMsg)+'</div>':"")+'</form>';
  h+='<div class="summary"><div><div class="k">Aeródromos en ruta</div><div class="v">'+tot.n+' de '+total+'</div></div><div><div class="k">Conducción total</div><div class="v">'+dur(tot.drive)+'</div></div><div><div class="k">Distancia total</div><div class="v">'+km1(tot.km)+'</div></div>'+
   '<div><div class="k">Sin asignar</div><div class="v">'+state.plan.un.filter(function(i){return byId(i).on;}).length+'</div></div></div>';
  h+='<div class="toolbar"><button class="btn primary" data-act="optimize">Optimizar todo</button><button class="btn" data-act="clear">'+(clearing?'¿Seguro? Se quitan todos los aeródromos':'Vaciar lista de aeródromos')+'</button></div>';
  h+='<div class="board" id="board">';for(var k=0;k<state.nDays;k++)h+=colHTML(k);h+=unHTML()+'</div>';
  h+='<div class="below"><section class="card mapcard"><h2>Mapa</h2><div class="mapslot" id="mapslot"></div><div class="legend">';
  for(var l=0;l<state.nDays;l++)h+='<span><i style="background:var(--d'+(l%COLORS)+')"></i>Día '+(l+1)+'</span>';
  h+='</div><div class="muted" style="font-size:12px">Toca el mapa para ampliarlo. La línea discontinua es la vuelta al hotel.</div></section>';
  h+='<section class="card links"><h2>Navegar</h2>';
  for(var qd=0;qd<state.nDays;qd++){var Lk=linksFor(qd);
    h+='<div class="linkday" style="--dc:var(--d'+(qd%COLORS)+')"><div class="hd"><i></i>Día '+(qd+1)+' <span class="muted" style="font-weight:400">'+esc(dayDate(qd))+'</span></div>';
    if(!Lk)h+='<div class="muted">'+(state.hotel.set===false?'Indica primero el hotel.':'Sin destinos este día.')+'</div>';
    else{h+='<div class="navs"><a class="nav g" href="'+esc(Lk.g)+'" target="_blank" rel="noopener">Google Maps</a><a class="nav a" href="'+esc(Lk.a)+'" target="_blank" rel="noopener">Mapas de iPhone</a></div>'+
      '<div class="wazes"><span>Waze, parada a parada:</span>'+Lk.w.map(function(x,i){return '<a class="nav mini" href="'+esc(x.url)+'" target="_blank" rel="noopener">'+(i+1)+'. '+esc(x.p.code||x.p.name)+'</a>';}).join("")+'</div>';}
    h+='</div>';}
  h+='<div class="foot">Google Maps y Mapas de iPhone abren la ruta completa del día, saliendo y volviendo al hotel. Waze solo admite un destino por vez, por eso hay un botón por parada.</div></section></div>';
  if(modal){var keep=mapEl;}
  app.innerHTML=h;
  var ds=app.querySelectorAll("details");open.forEach(function(i){if(ds[i])ds[i].open=true;});
  if(aid){var el=document.getElementById(aid);if(el){if(aval!=null)el.value=aval;try{el.focus();}catch(x){}}}
  mountMap();
}

/* ---------- Acciones ---------- */
function removeFromPlan(id){state.plan.days=state.plan.days.map(function(a){return a.filter(function(i){return i!==id;});});state.plan.un=state.plan.un.filter(function(i){return i!==id;});}
function moveTo(id,target,index){
  removeFromPlan(id);var p=byId(id);
  if(target==="u"){state.plan.un.push(id);p.pin=-1;}
  else{var t=+target,Ls=state.plan.days[t];if(index==null||index>Ls.length)index=Ls.length;Ls.splice(index,0,id);p.pin=t;}
}
function posOf(id){var r=-1;state.plan.days.forEach(function(a,d){if(a.indexOf(id)>-1)r=d;});return r;}
app.addEventListener("click",function(e){
  var b=e.target.closest("[data-act]");if(!b)return;var a=b.dataset.act,id=b.dataset.id;
  if(a==="optimize"){state.places.forEach(function(p){p.pin=null;});optimizeAll();save();render();toast("Ruta optimizada");}
  else if(a==="clear"){if(!clearing){clearing=true;render();setTimeout(function(){if(clearing){clearing=false;render();}},4000);}
    else{clearing=false;state.places=[];state.plan={days:[],un:[]};state.ov={};state.example=false;normalizePlan();memo=new Map();save();render();}}
  else if(a==="retry"){routeMode="idle";refreshRoutes(true);}
  else if(a==="daysplus"){if(state.nDays<7){state.nDays++;normalizePlan();optimizeAll();save();render();}}
  else if(a==="daysminus"){if(state.nDays>1){state.nDays--;normalizePlan();optimizeAll();save();render();}}
  else if(a==="applydef"){state.days=state.days.map(function(){return {start:state.cfg.defStart,end:state.cfg.defEnd,max:+state.cfg.defMax};});optimizeAll();save();render();}
  else if(a==="reorder"){reorderDay(+b.dataset.d);save();render();}
  else if(a==="unpin"){byId(id).pin=null;save();render();}
  else if(a==="remove"){removing=id;render();setTimeout(function(){if(removing===id){removing=null;render();}},3500);}
  else if(a==="remove2"){removeFromPlan(id);state.places=state.places.filter(function(p){return p.id!==id;});removing=null;optimizeAll();save();render();}
  else if(a==="zoom"){openModal();}
  else if(a==="pick"){var it=suggItems[+b.dataset.i];if(it)addPlace(it);}
  else if(a==="hsearch"){searchHotel(document.getElementById("hotelq").value);}
  else if(a==="pickhotel"){var h=hotelItems[+b.dataset.i];if(h)setHotel({name:h.name,lat:h.lat,lon:h.lon,approx:false});}
  else if(a==="legedit"){editingLeg=okey(b.dataset.a,b.dataset.b);render();}
  else if(a==="legsave"){var mn=Math.max(1,Math.round(+document.getElementById("lgm").value||1)),kk=Math.max(0,+document.getElementById("lgk").value||0);
    state.ov[okey(b.dataset.a,b.dataset.b)]={min:mn,km:Math.round(kk*10)/10};editingLeg=null;memo=new Map();optimizeAll();save();render();}
  else if(a==="legreset"){delete state.ov[okey(b.dataset.a,b.dataset.b)];editingLeg=null;memo=new Map();optimizeAll();save();render();}
  else if(a==="posedit"){editingPos=id;render();var pi=document.getElementById("posin");if(pi)pi.focus();}
  else if(a==="poscancel"){editingPos=null;render();}
  else if(a==="possave"){var c=parseCoords(document.getElementById("posin").value);
    if(!c){toast("No entiendo las coordenadas. Ejemplo: 37.8368, -1.0977");return;}
    var p2=byId(id);p2.lat=c.lat;p2.lon=c.lon;p2.approx=false;p2.note="";editingPos=null;state.ov={};
    Object.keys(state.ov).forEach(function(k){if(k.indexOf(id)>-1)delete state.ov[k];});
    optimizeAll();save();render();refreshRoutes(true);}
});
app.addEventListener("change",function(e){
  var t=e.target,f=t.dataset.field;if(!f&&t.dataset.act!=="toggle")return;
  if(t.dataset.act==="toggle"){var p=byId(t.dataset.id);p.on=t.checked;memo=new Map();var loc=posOf(p.id);if(loc>=0&&p.on)reorderDay(loc);save();render();return;}
  if(f==="visit"){var pp=byId(t.dataset.id);pp.visit=Math.max(5,+t.value||120);var lc=posOf(pp.id);memo=new Map();if(lc>=0)reorderDay(lc);save();render();}
  else if(f==="moveto"){var id=t.dataset.id,from=posOf(id);moveTo(id,t.value);memo=new Map();if(t.value!=="u")reorderDay(+t.value);if(from>=0)reorderDay(from);save();render();}
  else if(f==="dstart"||f==="dend"||f==="dmax"){var dd=+t.dataset.d;if(f==="dstart")state.days[dd].start=t.value||"08:00";else if(f==="dend")state.days[dd].end=t.value||"18:00";else state.days[dd].max=Math.max(1,+t.value||8);memo=new Map();save();render();}
  else if(f==="firstDate"){state.firstDate=t.value;save();render();}
  else if(f.indexOf("cfg.")===0){var k=f.slice(4);state.cfg[k]=t.type==="checkbox"?t.checked:(t.type==="number"?+t.value:t.value);memo=new Map();optimizeAll();save();render();}
});
app.addEventListener("input",function(e){
  if(e.target.id==="addtxt")updateSuggestions(e.target.value);
});
app.addEventListener("keydown",function(e){
  if(e.target.id==="hotelq"&&e.key==="Enter"){e.preventDefault();searchHotel(e.target.value);}
  if(e.target.id==="posin"&&e.key==="Enter"){e.preventDefault();var b=app.querySelector('[data-act="possave"]');if(b)b.click();}
  if(e.key==="Escape"){var s=document.getElementById("sugg");if(s)s.hidden=true;var hs=document.getElementById("hsugg");if(hs)hs.hidden=true;}
});
app.addEventListener("submit",function(e){
  if(e.target.id!=="addform")return;e.preventDefault();
  var txt=document.getElementById("addtxt").value.trim();if(!txt)return;
  if(suggItems.length){addPlace(suggItems[0]);return;}
  var c=parseCoords(txt);if(c){addPlace({name:"Punto "+c.lat.toFixed(4)+", "+c.lon.toFixed(4),code:"",muni:"",lat:c.lat,lon:c.lon,approx:false});return;}
  addMsg="Espera a que aparezcan resultados bajo el cuadro, o pega coordenadas.";render();
});
document.addEventListener("click",function(e){
  if(!e.target.closest(".field")){["sugg","hsugg"].forEach(function(i){var s=document.getElementById(i);if(s&&!e.target.closest("#"+i))s.hidden=true;});}
});
document.addEventListener("click",function(e){var b=e.target.closest("button[data-act='zoom']");if(b&&b.closest("#app")===null&&false){}});

/* ---------- Arrastrar y soltar (ratón y táctil) ---------- */
app.addEventListener("pointerdown",function(e){
  var g=e.target.closest(".grip");if(!g||(e.button!=null&&e.button>0))return;
  e.preventDefault();var card=g.closest(".stop"),r=card.getBoundingClientRect(),ghost=card.cloneNode(true);
  ghost.classList.add("ghost");ghost.style.width=r.width+"px";document.body.appendChild(ghost);
  drag={id:card.dataset.id,ghost:ghost,dx:e.clientX-r.left,dy:e.clientY-r.top,card:card,target:null,index:null};
  card.classList.add("dragging");moveGhost(e);
});
function moveGhost(e){
  drag.ghost.style.left=(e.clientX-drag.dx)+"px";drag.ghost.style.top=(e.clientY-drag.dy)+"px";
  var board=document.getElementById("board"),br=board.getBoundingClientRect();
  if(e.clientX>br.right-50)board.scrollLeft+=16;else if(e.clientX<br.left+50)board.scrollLeft-=16;
  var el=document.elementFromPoint(e.clientX,e.clientY),col=el&&el.closest("[data-col]");
  document.querySelectorAll(".col.over").forEach(function(c){c.classList.remove("over");});
  if(col){col.classList.add("over");drag.target=col.dataset.col;
    var stops=[].slice.call(col.querySelectorAll(".stop")).filter(function(s){return s!==drag.card;}),idx=stops.length;
    for(var i=0;i<stops.length;i++){var sr=stops[i].getBoundingClientRect();if(e.clientY<sr.top+sr.height/2){idx=i;break;}}
    drag.index=idx;
  }else drag.target=null;
}
document.addEventListener("pointermove",function(e){if(drag)moveGhost(e);});
function endDrag(e,cancel){
  if(!drag)return;var d=drag;drag=null;d.ghost.remove();
  document.querySelectorAll(".col.over").forEach(function(c){c.classList.remove("over");});
  if(cancel||d.target==null){render();return;}
  var from=posOf(d.id),idx=d.index;
  if(d.target!=="u"){var full=state.plan.days[+d.target].filter(function(i){return i!==d.id;}),visible=full.filter(function(i){return byId(i).on;});
    idx=idx>=visible.length?full.length:full.indexOf(visible[idx]);}
  moveTo(d.id,d.target,idx);memo=new Map();
  if(d.target!=="u"&&+d.target!==from)reorderDay(+d.target);
  if(from>=0&&String(from)!==d.target)reorderDay(from);
  save();render();
}
document.addEventListener("pointerup",function(e){endDrag(e,false);});
document.addEventListener("pointercancel",function(e){endDrag(e,true);});

/* ---------- Arranque ---------- */
normalizePlan();
if(!state.plan.days.some(function(a){return a.length;})&&state.places.length)optimizeAll();
render();save();
refreshRoutes(true);
window.__app={state:function(){return state;},addPlace:addPlace,setHotel:setHotel,optimizeAll:optimizeAll,evalDay:evalDay,render:render,searchDB:searchDB,parseCoords:parseCoords,leg:leg};
})();
</script>
</body>
